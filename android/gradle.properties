# This PC is short of memory and shares it with another Android project: one Gradle process,
# nothing left resident after the build, the Kotlin compiler (a dependency's) inside Gradle.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false
org.gradle.configureondemand=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# a missing SDK package fails the build instead of downloading into the shared SDK folder
android.builder.sdkDownload=false
